<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>CHISPA — Spatial Notes</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#000;
  --text:rgba(255,255,255,0.92);
  --soft:rgba(255,255,255,0.38);
  --accent:#8df0c8;
  --line:rgba(255,255,255,0.06);
}

html, body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  font-family:'Cormorant Garamond', serif;
  color:var(--text);
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

.app{
  width:100vw;
  height:100vh;
  position:relative;
}

/* -------------------- */
/* SCREEN SYSTEM FIX */
/* -------------------- */

.screen{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  padding:28px;
}

.screen.active{
  display:flex;
}

.panel{
  width:100%;
  max-width:460px;
  height:92vh;
  border:1px solid var(--line);
  border-radius:38px;
  background:rgba(255,255,255,0.02);
  backdrop-filter:blur(20px);
  overflow:hidden;
}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:28px;
}

.direction{
  font-size:11px;
  letter-spacing:6px;
  color:var(--soft);
}

.save-status{
  font-size:11px;
  color:var(--accent);
  letter-spacing:3px;
}

.note-area{
  height:100%;
  padding:60px 38px 120px;
}

textarea{
  width:100%;
  height:100%;
  background:transparent;
  border:none;
  outline:none;
  resize:none;
  color:var(--text);
  font-size:26px;
  line-height:1.8;
  font-family:'Cormorant Garamond', serif;
  caret-color:var(--accent);
}

/* -------------------- */
/* LAYOUT SCREENS */
/* -------------------- */

</style>

</head>

<body>

<div class="app">

<!-- CENTER -->
<section class="screen active" id="center">
  <div class="panel">
    <div class="topbar">
      <div class="direction">CENTER</div>
      <div class="save-status" id="save-center">saved</div>
    </div>
    <div class="note-area">
      <textarea id="note-center" placeholder="The present moment..."></textarea>
    </div>
  </div>
</section>

<!-- NORTH -->
<section class="screen" id="north">
  <div class="panel">
    <div class="topbar">
      <div class="direction">NORTH</div>
      <div class="save-status" id="save-north">saved</div>
    </div>
    <div class="note-area">
      <textarea id="note-north"></textarea>
    </div>
  </div>
</section>

<!-- SOUTH -->
<section class="screen" id="south">
  <div class="panel">
    <div class="topbar">
      <div class="direction">SOUTH</div>
      <div class="save-status" id="save-south">saved</div>
    </div>
    <div class="note-area">
      <textarea id="note-south"></textarea>
    </div>
  </div>
</section>

<!-- EAST -->
<section class="screen" id="east">
  <div class="panel">
    <div class="topbar">
      <div class="direction">EAST</div>
      <div class="save-status" id="save-east">saved</div>
    </div>
    <div class="note-area">
      <textarea id="note-east"></textarea>
    </div>
  </div>
</section>

<!-- WEST -->
<section class="screen" id="west">
  <div class="panel">
    <div class="topbar">
      <div class="direction">WEST</div>
      <div class="save-status" id="save-west">saved</div>
    </div>
    <div class="note-area">
      <textarea id="note-west"></textarea>
    </div>
  </div>
</section>

</div>

<!-- NAVIGATION SCRIPT -->
<script src="js/navigation.js"></script>
<script src="js/storage.js"></script>

</body>
</html>
