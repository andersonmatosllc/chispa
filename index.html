<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>CHISPA — Spatial Notes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{

      --bg:#000000;
      --panel:#050505;

      --line:rgba(255,255,255,0.06);

      --text:rgba(255,255,255,0.92);
      --soft:rgba(255,255,255,0.38);

      --accent:#8df0c8;

    }

    html,
    body{

      width:100%;
      height:100%;
      overflow:hidden;

      background:var(--bg);

      font-family:'Cormorant Garamond', serif;

      color:var(--text);

    }

    body{

      display:flex;
      align-items:center;
      justify-content:center;

    }

    .ambient-glow{

      position:fixed;

      width:900px;
      height:900px;

      border-radius:50%;

      background:
      radial-gradient(
        circle,
        rgba(141,240,200,0.05),
        transparent 70%
      );

      filter:blur(100px);

      pointer-events:none;

      animation:floatGlow 10s ease-in-out infinite;

    }

    @keyframes floatGlow{

      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-20px);
      }

      100%{
        transform:translateY(0px);
      }

    }

    .app{

      position:relative;

      width:100vw;
      height:100vh;

      overflow:hidden;

    }

    .screen{

      position:absolute;

      width:100%;
      height:100%;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:28px;

      transition:
      transform 0.8s cubic-bezier(0.22,1,0.36,1),
      opacity 0.8s ease;

    }

    .panel{

      position:relative;

      width:100%;
      max-width:460px;

      height:92vh;

      background:
      linear-gradient(
        180deg,
        rgba(255,255,255,0.025),
        rgba(255,255,255,0.008)
      );

      border:1px solid var(--line);

      border-radius:38px;

      backdrop-filter:blur(24px);

      overflow:hidden;

      box-shadow:
      0 0 60px rgba(255,255,255,0.02),
      inset 0 0 30px rgba(255,255,255,0.015);

    }

    .topbar{

      width:100%;

      padding:28px 28px 0 28px;

      display:flex;
      justify-content:space-between;
      align-items:center;

    }

    .direction{

      font-size:11px;

      letter-spacing:6px;

      color:var(--soft);

      text-transform:uppercase;

    }

    .save-status{

      font-size:11px;

      letter-spacing:3px;

      color:rgba(141,240,200,0.7);

      text-transform:uppercase;

    }

    .note-area{

      width:100%;
      height:100%;

      padding:
      80px
      38px
      120px
      38px;

    }

    textarea{

      width:100%;
      height:100%;

      background:transparent;

      border:none;
      outline:none;
      resize:none;

      color:var(--text);

      font-family:'Cormorant Garamond', serif;

      font-size:26px;

      line-height:1.9;

      font-weight:300;

      letter-spacing:0.4px;

      caret-color:var(--accent);

    }

    textarea::placeholder{

      color:rgba(255,255,255,0.16);

    }

    .bottom-line{

      position:absolute;

      bottom:42px;
      left:38px;

      width:120px;
      height:1px;

      background:rgba(255,255,255,0.08);

    }

    .navigation{

      position:absolute;

      bottom:36px;
      right:38px;

      font-size:10px;

      letter-spacing:4px;

      text-transform:uppercase;

      color:rgba(255,255,255,0.24);

    }

    .north{
      transform:translateY(-100%);
    }

    .south{
      transform:translateY(100%);
    }

    .east{
      transform:translateX(100%);
    }

    .west{
      transform:translateX(-100%);
    }

    .center{
      transform:translate(0,0);
    }

    .active{
      transform:translate(0,0);
      z-index:10;
    }

    @media(max-width:700px){

      .panel{

        height:100vh;
        border-radius:0;

      }

      textarea{

        font-size:24px;

      }

    }

  </style>

</head>

<body>

  <div class="ambient-glow"></div>

  <div class="app">

    <!-- CENTER -->

    <section class="screen center active" id="center">

      <div class="panel">

        <div class="topbar">

          <div class="direction">
            [ C ] CENTER
          </div>

          <div class="save-status" id="save-center">
            saved
          </div>

        </div>

        <div class="note-area">

          <textarea
            id="note-center"
            placeholder="The present moment..."
          ></textarea>

        </div>

        <div class="bottom-line"></div>

        <div class="navigation">
          swipe / arrows
        </div>

      </div>

    </section>

    <!-- NORTH -->

    <section class="screen north" id="north">

      <div class="panel">

        <div class="topbar">

          <div class="direction">
            [ N ] NORTH
          </div>

          <div class="save-status" id="save-north">
            saved
          </div>

        </div>

        <div class="note-area">

          <textarea
            id="note-north"
            placeholder="Spiritual direction..."
          ></textarea>

        </div>

        <div class="bottom-line"></div>

      </div>

    </section>

    <!-- SOUTH -->

    <section class="screen south" id="south">

      <div class="panel">

        <div class="topbar">

          <div class="direction">
            [ S ] SOUTH
          </div>

          <div class="save-status" id="save-south">
            saved
          </div>

        </div>

        <div class="note-area">

          <textarea
            id="note-south"
            placeholder="Body / ritual / recovery..."
          ></textarea>

        </div>

        <div class="bottom-line"></div>

      </div>

    </section>

    <!-- EAST -->

    <section class="screen east" id="east">

      <div class="panel">

        <div class="topbar">

          <div class="direction">
            [ E ] EAST
          </div>

          <div class="save-status" id="save-east">
            saved
          </div>

        </div>

        <div class="note-area">

          <textarea
            id="note-east"
            placeholder="Ideas / creation / expansion..."
          ></textarea>

        </div>

        <div class="bottom-line"></div>

      </div>

    </section>

    <!-- WEST -->

    <section class="screen west" id="west">

      <div class="panel">

        <div class="topbar">

          <div class="direction">
            [ O ] WEST
          </div>

          <div class="save-status" id="save-west">
            saved
          </div>

        </div>

        <div class="note-area">

          <textarea
            id="note-west"
            placeholder="Work / service / reality..."
          ></textarea>

        </div>

        <div class="bottom-line"></div>

      </div>

    </section>

  </div>

  <script>
